<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enterprise Login | TaskFlow Office</title>

    <!-- Premium Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap"
        rel="stylesheet">

    <!-- Icons & Styling -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="index.css">

    <style>
        :root {
            --it-primary: #6366f1;
            --it-secondary: #0ea5e9;
            --it-bg: #f1f5f9;
            --glass-blue: rgba(255, 255, 255, 0.9);
            --glass-border: rgba(0, 0, 0, 0.08);
        }

        body.login-page {
            background: var(--it-bg);
            margin: 0;
            padding: 0;
            /* Override global padding */
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            font-family: 'Outfit', sans-serif;
            color: #0f172a;
        }

        /* Animated Tech Background - Light */
        .tech-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            background: radial-gradient(circle at 50% 50%, #f8fafc 0%, #e2e8f0 100%);
        }

        .grid-overlay {
            position: absolute;
            width: 200%;
            height: 200%;
            top: -50%;
            left: -50%;
            background-image:
                linear-gradient(rgba(99, 102, 241, 0.05) 1px, transparent 1px),
                linear-gradient(90deg, rgba(99, 102, 241, 0.05) 1px, transparent 1px);
            background-size: 50px 50px;
            transform: perspective(500px) rotateX(60deg);
            animation: grid-move 20s linear infinite;
        }

        @keyframes grid-move {
            from {
                transform: perspective(500px) rotateX(60deg) translateY(0);
            }

            to {
                transform: perspective(500px) rotateX(60deg) translateY(50px);
            }
        }

        .glow-sphere {
            position: absolute;
            width: 600px;
            height: 600px;
            background: radial-gradient(circle, rgba(99, 102, 241, 0.1) 0%, transparent 70%);
            border-radius: 50%;
            filter: blur(80px);
            animation: pulse 10s infinite alternate;
        }

        @keyframes pulse {
            from {
                transform: translate(-20%, -20%) scale(1);
                opacity: 0.4;
            }

            to {
                transform: translate(10%, 10%) scale(1.2);
                opacity: 0.6;
            }
        }

        /* Login Card */
        .login-card {
            width: 100%;
            max-width: 440px;
            padding: 50px;
            background: var(--glass-blue);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            border-radius: 32px;
            box-shadow: 0 25px 80px -12px rgba(0, 0, 0, 0.1);
            position: relative;
            z-index: 10;
        }

        .login-card::before {
            content: '';
            position: absolute;
            top: -1px;
            left: 50%;
            transform: translateX(-50%);
            width: 60%;
            height: 2px;
            background: linear-gradient(90deg, transparent, var(--it-primary), transparent);
        }

        .brand-section {
            text-align: center;
            margin-bottom: 40px;
        }

        .brand-logo {
            width: 64px;
            height: 64px;
            background: linear-gradient(135deg, var(--it-primary), var(--it-secondary));
            margin: 0 auto 20px;
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            color: white;
            box-shadow: 0 0 30px rgba(99, 102, 241, 0.3);
            transform: rotate(-5deg);
        }

        h2 {
            font-size: 2.2rem;
            font-weight: 800;
            letter-spacing: -1.5px;
            margin-bottom: 10px;
            background: linear-gradient(to right, #1e293b, #64748b);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .subtitle {
            font-size: 0.95rem;
            color: #64748b;
            font-weight: 500;
        }

        /* Form Controls */
        .form-group {
            margin-bottom: 20px;
        }

        .input-wrapper {
            position: relative;
        }

        .input-wrapper input {
            width: 100%;
            background: #ffffff;
            border: 2px solid #e2e8f0;
            border-radius: 16px;
            padding: 16px 16px 16px 52px;
            color: #1e293b;
            font-size: 1rem;
            font-family: 'JetBrains Mono', monospace;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .input-wrapper input:focus {
            outline: none;
            border-color: var(--it-primary);
            background: #ffffff;
            box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.1);
        }

        .input-icon {
            position: absolute;
            left: 20px;
            top: 50%;
            transform: translateY(-50%);
            color: #64748b;
            font-size: 1.1rem;
            transition: color 0.3s;
        }

        .input-wrapper input:focus+.input-icon {
            color: var(--it-primary);
        }

        .btn-it {
            width: 100%;
            background: var(--it-primary);
            background: linear-gradient(135deg, var(--it-primary), #4f46e5);
            color: white;
            border: none;
            padding: 16px;
            border-radius: 16px;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            transition: all 0.3s;
            box-shadow: 0 10px 20px -10px rgba(99, 102, 241, 0.5);
            margin-top: 10px;
        }

        .btn-it:hover {
            transform: translateY(-2px);
            box-shadow: 0 15px 30px -10px rgba(99, 102, 241, 0.6);
            filter: brightness(1.1);
        }

        .btn-it:active {
            transform: translateY(0);
        }

        .btn-it:disabled {
            opacity: 0.7;
            cursor: not-allowed;
            transform: none;
        }

        #error-message {
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid rgba(239, 68, 68, 0.2);
            color: #f87171;
            padding: 12px;
            border-radius: 12px;
            margin-top: 20px;
            font-size: 0.85rem;
            text-align: center;
            display: none;
            animation: shake 0.4s cubic-bezier(.36, .07, .19, .97) both;
        }

        @keyframes shake {

            10%,
            90% {
                transform: translate3d(-1px, 0, 0);
            }

            20%,
            80% {
                transform: translate3d(2px, 0, 0);
            }

            30%,
            50%,
            70% {
                transform: translate3d(-4px, 0, 0);
            }

            40%,
            60% {
                transform: translate3d(4px, 0, 0);
            }
        }

        .legal-footer {
            text-align: center;
            margin-top: 40px;
            font-size: 0.75rem;
            color: #475569;
            letter-spacing: 0.5px;
        }
    </style>
</head>

<body class="login-page">
    <div class="tech-bg">
        <div class="grid-overlay"></div>
        <div class="glow-sphere" style="top: -100px; right: -100px;"></div>
        <div class="glow-sphere"
            style="bottom: -100px; left: -100px; background: radial-gradient(circle, rgba(14, 165, 233, 0.1) 0%, transparent 70%);">
        </div>
    </div>

    <div class="login-card">
        <div class="brand-section">
            <div class="brand-logo">
                <i class="fa-solid fa-microchip"></i>
            </div>
            <h2>Quantum Core</h2>
            <p class="subtitle" id="greeting">Initializing secure session...</p>
        </div>

        <form id="login-form">
            <div class="form-group">
                <div class="input-wrapper">
                    <input type="text" id="username" placeholder="Employee ID / User" required autocomplete="off">
                    <i class="fa-solid fa-terminal input-icon"></i>
                </div>
            </div>
            <div class="form-group">
                <div class="input-wrapper">
                    <input type="password" id="password" placeholder="Access Token" required>
                    <i class="fa-solid fa-shield-halved input-icon"></i>
                </div>
            </div>

            <button type="submit" class="btn-it">
                <span>AUTHENTICATE</span>
                <i class="fa-solid fa-arrow-right"></i>
            </button>
        </form>

        <p id="error-message"></p>

        <div class="legal-footer">
            SYSTEM-AUTH-V2 // ENCRYPTION: AES-256-GCM<br>
            SECURE OFFICE TERMINAL #042
        </div>
    </div>

    <script>
        // High-end dynamic greeting
        const getGreeting = () => {
            const hour = new Date().getHours();
            if (hour < 12) return 'Ready for a high-performance morning?';
            if (hour < 17) return 'Operational excellence in progress.';
            return 'Late shift active. Monitoring systems...';
        };
        document.getElementById('greeting').textContent = getGreeting();

        const API_BASE = window.location.protocol === 'file:' ? 'http://localhost:5000/api' : '/api';

        document.getElementById('login-form').onsubmit = async (e) => {
            e.preventDefault();
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const errorMsg = document.getElementById('error-message');
            const submitBtn = e.target.querySelector('button[type="submit"]');

            errorMsg.style.display = 'none';
            submitBtn.innerHTML = '<i class="fa-solid fa-atom fa-spin"></i> ENCRYPTING...';
            submitBtn.disabled = true;

            try {
                const res = await fetch(`${API_BASE}/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });

                const data = await res.json();
                if (res.ok) {
                    sessionStorage.setItem('user', JSON.stringify(data.user));

                    // Log activity
                    try {
                        await fetch(`${API_BASE}/activities`, {
                            method: 'POST',
                            headers: {
                                'Content-Type': 'application/json',
                                'x-user-role': data.user.role,
                                'x-user-name': data.user.username
                            },
                            body: JSON.stringify({
                                activityType: 'login',
                                employee: data.user.username,
                                description: `Terminal session started`,
                                metadata: { role: data.user.role }
                            })
                        });
                    } catch (ignore) { }

                    // Determine Dashboard based on Role
                    const role = (data.user.role || '').toLowerCase();
                    if (role === 'admin') {
                        window.location.href = 'employee_details.html';
                    } else {
                        window.location.href = 'index.html'; // Employees start at Profile (Step 1)
                    }
                } else {
                    errorMsg.innerText = 'ACCESS DENIED: ' + (data.message || 'Invalid Credentials');
                    errorMsg.style.display = 'block';
                    submitBtn.innerHTML = 'AUTHENTICATE <i class="fa-solid fa-arrow-right"></i>';
                    submitBtn.disabled = false;
                }
            } catch (err) {
                errorMsg.innerText = 'SERVICE UNAVAILABLE: Check Server Status';
                errorMsg.style.display = 'block';
                submitBtn.innerHTML = 'AUTHENTICATE <i class="fa-solid fa-arrow-right"></i>';
                submitBtn.disabled = false;
            }
        };
    </script>
</body>

</html>
