<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Project Timeline | TaskFlow Office</title>
    <link rel="stylesheet" href="index.css">
    <script>
        if (!sessionStorage.getItem('user')) {
            window.location.href = 'portal-selection.html';
        }
    </script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>

<body>
    <div class="background-glob"></div>

    <nav class="steps">
        <a href="index.html" class="step">
            <span>1</span>
            Profile
        </a>
        <a href="team.html" class="step">
            <span>2</span>
            Team
        </a>
        <a href="tasks.html" class="step">
            <span>3</span>
            Tasks
        </a>
        <a href="timeline.html" class="step active">
            <span>4</span>
            Timeline
        </a>
        <a href="showcase.html" class="step">
            <span>5</span>
            Showcase
        </a>
        <a href="employee-activity.html" class="step">
            <span>6</span>
            Activity Log
        </a>
        <a href="reporting.html" class="step">
            <span>7</span>
            Reporting
        </a>
        <a href="employee_details.html" class="step" id="admin-nav-item" style="display: none;">
            <span>8</span>
            Employee Details
        </a>
        <button id="logout-btn" class="step"
            style="border: none; background: transparent; cursor: pointer; color: #ef4444;">
            <i class="fa-solid fa-power-off"></i>
            Logout
        </button>
    </nav>

    <div class="page-container wide">
        <div class="card">
            <header class="card-header">
                <div class="header-icon">
                    <i class="fa-solid fa-calendar-days"></i>
                </div>
                <div class="header-text">
                    <h2>Project Roadmap</h2>
                    <p>Visualizing the journey from ideation to global shipment.</p>
                </div>
            </header>

            <div class="form-content">
                <div id="timeline-container" class="timeline-wrapper">
                    <!-- Data rendered by JS -->
                    <div style="text-align: center; padding: 100px; color: var(--text-muted);">
                        <i class="fa-solid fa-circle-notch fa-spin fa-3x"></i>
                        <p style="margin-top: 20px;">Mapping your professional success...</p>
                    </div>
                </div>
            </div>


        </div>
    </div>

    <style>
        .timeline-wrapper {
            position: relative;
            padding: 20px 0;
        }

        .timeline-item {
            display: grid;
            grid-template-columns: 180px 1fr;
            gap: 30px;
            margin-bottom: 40px;
            position: relative;
        }

        .timeline-item::before {
            content: '';
            position: absolute;
            left: 195px;
            top: 0;
            bottom: -40px;
            width: 2px;
            background: var(--border-color);
            z-index: 0;
        }

        .timeline-item:last-child::before {
            display: none;
        }

        .timeline-date {
            text-align: right;
            padding-top: 5px;
        }

        .timeline-date h4 {
            font-size: 1.1rem;
            font-weight: 700;
            color: var(--primary);
            font-family: var(--font-mono);
        }

        .timeline-date p {
            font-size: 0.75rem;
            color: var(--text-muted);
            text-transform: uppercase;
            font-weight: 600;
        }

        .timeline-content {
            background: var(--bg-surface);
            padding: 24px;
            border-radius: var(--radius-lg);
            border: 1px solid var(--border-color);
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.2);
            position: relative;
            z-index: 1;
            transition: all 0.3s;
        }

        .timeline-content:hover {
            transform: scale(1.01) translateX(10px);
            border-color: var(--primary);
            box-shadow: 0 10px 30px -5px rgba(0, 0, 0, 0.3);
        }

        .timeline-dot {
            position: absolute;
            left: 188px;
            top: 20px;
            width: 16px;
            height: 16px;
            background: var(--bg-surface);
            border: 3px solid var(--primary);
            border-radius: 50%;
            z-index: 2;
            box-shadow: 0 0 10px var(--primary-glow);
        }
    </style>

    <div id="modal-container" class="modal-overlay"></div>

    <script src="app.js" data-page="timeline"></script>
</body>

</html>
