<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Team Management - TaskFlow Office</title>

    <!-- Fonts & Icons -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <link rel="stylesheet" href="index.css">
    <script>
        if (!sessionStorage.getItem('user')) {
            window.location.href = 'portal-selection.html';
        }
    </script>
</head>

<body>
    <div class="background-glob"></div>

    <nav class="steps">
        <a href="index.html" class="step">
            <span>1</span>
            Profile
        </a>
        <a href="team.html" class="step active">
            <span>2</span>
            Team
        </a>
        <a href="tasks.html" class="step">
            <span>3</span>
            Tasks
        </a>
        <a href="timeline.html" class="step">
            <span>4</span>
            Timeline
        </a>
        <a href="showcase.html" class="step">
            <span>5</span>
            Showcase
        </a>
        <a href="employee-activity.html" class="step">
            <span>6</span>
            Activity Log
        </a>
        <a href="reporting.html" class="step">
            <span>7</span>
            Reporting
        </a>
        <a href="employee_details.html" class="step" id="admin-nav-item" style="display: none;">
            <span>8</span>
            Employee Details
        </a>
        <button id="logout-btn" class="step"
            style="border: none; background: transparent; cursor: pointer; color: #ef4444;">
            <i class="fa-solid fa-power-off"></i>
            Logout
        </button>
    </nav>

    <div class="page-container wide">
        <div class="card">
            <div class="card-header">
                <div class="header-icon">
                    <i class="fa-solid fa-users"></i>
                </div>
                <div class="header-text">
                    <h2>Team Directory</h2>
                    <p>Connect with your colleagues and manage team members.</p>
                </div>
                <div style="margin-left: auto; display: flex; gap: 12px;">
                    <button id="open-new-team-modal" class="btn-outline">
                        <i class="fa-solid fa-folder-plus"></i> Create New Team
                    </button>
                    <!-- Global Add Member Button Removed -->
                </div>
            </div>

            <div class="form-content">
                <div id="team-container" class="team-container">
                    <!-- Grouped by Department in app.js -->
                    <p style="text-align: center; color: var(--text-muted); padding: 40px;">Initializing department
                        directory...</p>
                </div>
            </div>


        </div>
    </div>

    <!-- Modal Container -->
    <div id="modal-container" class="modal-overlay"></div>

    <script src="app.js?v=2" data-page="team"></script>
</body>

</html>
