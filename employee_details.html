<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Employee Profile - TaskFlow Office</title>

    <!-- Fonts & Icons -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <link rel="stylesheet" href="index.css">
    <script>
        if (!sessionStorage.getItem('user')) {
            window.location.href = 'portal-selection.html';
        }
    </script>
</head>

<body>
    <div class="background-glob"></div>

    <!-- Navigation Bar -->
    <nav class="steps">
        <a href="index.html" class="step">
            <span>1</span>
            Profile
        </a>
        <a href="team.html" class="step">
            <span>2</span>
            Team
        </a>
        <a href="tasks.html" class="step">
            <span>3</span>
            Tasks
        </a>
        <a href="timeline.html" class="step">
            <span>4</span>
            Timeline
        </a>
        <a href="showcase.html" class="step">
            <span>5</span>
            Showcase
        </a>
        <a href="employee-activity.html" class="step">
            <span>6</span>
            Activity Log
        </a>
        <a href="reporting.html" class="step">
            <span>7</span>
            Reporting
        </a>
        <a href="employee_details.html" class="step active" id="admin-nav-item" style="display: none;">
            <span>8</span>
            Employee Details
        </a>
        <button id="logout-btn" class="step"
            style="border: none; background: transparent; cursor: pointer; color: #ef4444;">
            <i class="fa-solid fa-power-off"></i>
            Logout
        </button>
    </nav>

    <div class="page-container wide">
        <div class="card">
            <div class="card-header">
                <div class="header-icon">
                    <i class="fa-solid fa-id-card"></i>
                </div>
                <div class="header-text">
                    <h2>Employee Details Directory</h2>
                    <p>Comprehensive administrative view of all employee profiles and records.</p>
                </div>
            </div>

            <div class="form-content">
                <!-- Search / Filter -->
                <div style="margin-bottom: 30px; display: flex; gap: 15px;">
                    <input type="text" id="emp-search" placeholder="Search by name or email..." class="form-control"
                        style="padding: 15px; border-radius: 12px; border: 1px solid #e2e8f0; flex: 1;">
                </div>

                <div id="employee-list-container" class="profile-info-grid"
                    style="grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));">
                    <!-- Loaded by app.js -->
                    <div style="text-align: center; padding: 40px; color: var(--text-muted); grid-column: 1/-1;">
                        <i class="fa-solid fa-circle-notch fa-spin fa-2x"></i>
                        <p style="margin-top: 15px;">Loading directory...</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal Container -->
    <div id="modal-container" class="modal-overlay"></div>

    <script src="app.js" data-page="employee_details"></script>
</body>

</html>
