<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reporting - TaskFlow Office</title>

    <!-- Fonts & Icons -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <link rel="stylesheet" href="index.css">
    <script>
        if (!sessionStorage.getItem('user')) {
            window.location.href = 'portal-selection.html';
        }
    </script>
</head>

<body>
    <div class="background-glob"></div>
    <div class="background-glob-alt"></div>

    <nav class="steps">
        <a href="index.html" class="step">
            <span>1</span>
            Profile
        </a>
        <a href="team.html" class="step">
            <span>2</span>
            Team
        </a>
        <a href="tasks.html" class="step">
            <span>3</span>
            Tasks
        </a>
        <a href="timeline.html" class="step">
            <span>4</span>
            Timeline
        </a>
        <a href="showcase.html" class="step">
            <span>5</span>
            Showcase
        </a>
        <a href="employee-activity.html" class="step">
            <span>6</span>
            Activity Log
        </a>
        <a href="reporting.html" class="step active">
            <span>7</span>
            Reporting
        </a>
        <a href="employee_details.html" class="step" id="admin-nav-item" style="display: none;">
            <span>8</span>
            Employee Details
        </a>
        <button id="logout-btn" class="step"
            style="border: none; background: transparent; cursor: pointer; color: #ef4444;">
            <i class="fa-solid fa-power-off"></i>
            Logout
        </button>
    </nav>

    <div class="page-container wide">
        <div class="card">
            <div class="card-header">
                <div class="header-icon">
                    <i class="fa-solid fa-chart-line"></i>
                </div>
                <div class="header-text">
                    <h2>Performance Engine</h2>
                    <p>Real-time analytics and productivity intelligence.</p>
                </div>
            </div>

            <div class="form-content">
                <div id="reporting-content">
                    <!-- Statistics summary rendered by JS -->
                    <div class="stats-grid"
                        style="display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 24px;">
                        <!-- Content will be injected by renderReporting -->
                        <div style="text-align: center; padding: 40px; color: var(--text-muted); grid-column: 1/-1;">
                            <i class="fa-solid fa-circle-notch fa-spin fa-2x"></i>
                            <p style="margin-top: 15px;">Calculating metrics...</p>
                        </div>
                    </div>
                </div>
            </div>


        </div>
    </div>

    <!-- Modal Container -->
    <div id="modal-container" class="modal-overlay"></div>

    <script src="app.js" data-page="reporting"></script>
</body>

</html>
