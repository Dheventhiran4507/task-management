<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Executive Showcase | TaskFlow Office</title>

    <!-- Fonts & Icons -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <link rel="stylesheet" href="index.css">
    <script>
        if (!sessionStorage.getItem('user')) {
            window.location.href = 'login.html';
        }
    </script>
</head>

<body>
    <div class="background-glob"></div>
    <div class="background-glob-alt"></div>

    <nav class="steps">
        <a href="index.html" class="step">
            <span>1</span>
            Profile
        </a>
        <a href="team.html" class="step">
            <span>2</span>
            Team
        </a>
        <a href="tasks.html" class="step">
            <span>3</span>
            Tasks
        </a>
        <a href="timeline.html" class="step">
            <span>4</span>
            Timeline
        </a>
        <a href="showcase.html" class="step active">
            <span>5</span>
            Showcase
        </a>
        <a href="employee-activity.html" class="step">
            <span>6</span>
            Activity Log
        </a>
        <a href="reporting.html" class="step">
            <span>7</span>
            Reporting
        </a>
        <a href="employee_details.html" class="step" id="admin-nav-item" style="display: none;">
            <span>8</span>
            Employee Details
        </a>
        <button id="logout-btn" class="step"
            style="border: none; background: transparent; cursor: pointer; color: #ef4444;">
            <i class="fa-solid fa-power-off"></i>
            Logout
        </button>
    </nav>

    <div class="page-container wide">
        <div class="card">
            <header class="card-header" style="justify-content: space-between;">
                <div style="display: flex; align-items: center; gap: 20px;">
                    <div class="header-icon" style="background: var(--accent); color: white;">
                        <i class="fa-solid fa-trophy"></i>
                    </div>
                    <div class="header-text">
                        <h2>Innovation Showcase</h2>
                        <p>Celebrating elite project deliveries and quantifiable impact.</p>
                    </div>
                </div>
                <!-- Admin/Employee can only add to showcase if a project is complete -->
                <button id="open-project-modal" class="btn-primary" style="display: none;">
                    <i class="fa-solid fa-plus"></i> Showcase Project
                </button>
            </header>

            <div class="form-content" style="padding: 40px;">
                <div id="showcase-grid" class="profile-info-grid"
                    style="grid-template-columns: repeat(auto-fill, minmax(400px, 1fr)); gap: 30px;">
                    <!-- Rendered by app.js -->
                    <div style="text-align: center; padding: 100px; grid-column: 1/-1; opacity: 0.5;">
                        <i class="fa-solid fa-box-archive fa-4x" style="margin-bottom: 20px;"></i>
                        <h3>Awaiting Enterprise Shipments</h3>
                        <p>Completed projects will be featured here for executive review.</p>
                    </div>
                </div>
            </div>


        </div>
    </div>

    <!-- Modal Container -->
    <div id="modal-container" class="modal-overlay"></div>

    <script src="app.js" data-page="showcase"></script>
</body>

</html>
